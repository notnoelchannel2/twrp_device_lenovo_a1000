name: TWRP 5.1 Build for Lenovo A1000 (Docker/Bionic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af || true

      - name: Start Ubuntu 18.04 Container in Background
        run: |
          docker run -d --name bionic_64 --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:18.04 tail -f /dev/null

      - name: Prepare Container Repositories
        run: |
          docker exec bionic_64 rm -rf /etc/apt/sources.list.d/*
          docker exec bionic_64 rm -rf /var/lib/apt/lists/*
          docker exec -i bionic_64 bash -c "cat << 'EOF' > /etc/apt/sources.list
          deb http://archive.ubuntu.com/ubuntu/ bionic main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ bionic-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ bionic-security main restricted universe multiverse
          EOF"
          # If bionic ever gets pulled from the normal archive, fall back to old-releases:
          # deb http://old-releases.ubuntu.com/ubuntu/ bionic main restricted universe multiverse
          docker exec bionic_64 apt-get clean
          docker exec bionic_64 apt-get update -o Acquire::Check-Valid-Until=false

      - name: Install Build Dependencies
        run: |
          docker exec bionic_64 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            dpkg --add-architecture i386
            apt-get update -o Acquire::Check-Valid-Until=false
            apt-get install -y software-properties-common
            add-apt-repository -y universe
            apt-get update -o Acquire::Check-Valid-Until=false
            apt-get install -y \
              bc bison build-essential ccache curl flex axel \
              g++-multilib gcc-multilib git git-lfs gnupg gperf \
              imagemagick lib32readline-dev lib32z1-dev libdw-dev \
              libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
              libxml2-utils lzop pngcrush rsync schedtool \
              squashfs-tools xsltproc zip zlib1g-dev \
              libncurses5 libncurses5-dev libtinfo5 \
              python python3 python3-pip openjdk-8-jdk unzip wget
            ln -sf /usr/bin/python3 /usr/bin/python3.x 2>/dev/null || true
          '

      - name: Install repo tool
        run: |
          docker exec bionic_64 bash -c '
            set -e
            mkdir -p ~/.bin
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
            chmod a+x ~/.bin/repo
            git config --global user.email "ci@example.com"
            git config --global user.name "TWRP CI"
            git config --global color.ui false
            git config --global --add safe.directory "*"
          '

      - name: Sync TWRP Sources (twrp-5.1)
        run: |
          docker exec bionic_64 bash -c '
            set -e
            export PATH=~/.bin:$PATH
            mkdir -p ~/TWRP
            cd ~/TWRP
            repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1
            git clone --depth 1 --branch twrp-5.1 --single-branch \
              https://github.com/notnoelchannel2/twrp_device_lenovo_a1000.git \
              device/lenovo/a1000
            repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
          '

      - name: Clone Kernel
        run: |
          docker exec bionic_64 bash -c '
            set -e
            cd ~/TWRP
            git clone --depth 1 --branch main https://github.com/notnoelchannel2/lenovoa1000kernel3.10sourceENHANCED.git kernel/lenovo/a1000
          '

      - name: Building TWRP
        run: |
          docker exec bionic_64 bash -c '
            set -e
            export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
            export PATH=$JAVA_HOME/bin:$PATH
            cd ~/TWRP
            sed -i "s/if (sml != nullptr)/if (sml != NULL)/g" bootable/recovery/partition.cpp
            source build/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            export LC_ALL=C
            lunch omni_a1000-eng
            make -j$(nproc --all) recoveryimage
          '

      - name: Copy Output Out of Container
        if: success()
        run: |
          mkdir -p out
          docker cp bionic_64:/root/TWRP/out/target/product/a1000/recovery.img out/ || \
          docker cp bionic_64:/root/TWRP/out/target/product/a1000/. out/ || true

      - name: Uploading TWRP builds
        uses: actions/upload-artifact@v6
        with:
          name: twrp-a1000
          path: out/*
          if-no-files-found: warn
